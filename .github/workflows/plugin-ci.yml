name: plugin-ci (reusable)
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      bun-version:
        type: string
        default: '1.1.38'
concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: lvis-oracle-ci
      labels: [self-hosted, linux, arm64, oracle]
    # A job that no runner accepts does not error — it waits out the 24-hour
    # queue limit with no red check anywhere. That silence is how a broken
    # publish pipeline went unnoticed for days in 2026-08; the same shape is
    # available to any self-hosted job, so bound it here too. This is generous
    # for work that finishes in well under a minute.
    timeout-minutes: 30
    env:
      BUN_INSTALL: /tmp/lvis-bun-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Verify submodule integrity
        shell: bash
        run: |
          if [ -f .gitmodules ]; then
            git submodule status
            while IFS= read -r path; do
              if [ ! -e "$path/.git" ]; then
                echo "::error::Submodule $path not initialized"
                exit 1
              fi
              (cd "$path" && git describe --exact-match --tags HEAD >/dev/null 2>&1) || {
                echo "::warning::Submodule $path is not pinned to a tag"
              }
            done < <(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          fi
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint (if script exists)
        shell: bash
        run: |
          if grep -q '"lint"' package.json; then bun run lint; else echo "no lint script — skipping"; fi
      - name: Typecheck (if script exists)
        shell: bash
        run: |
          if grep -q '"typecheck"' package.json; then bun run typecheck; else echo "no typecheck script — skipping"; fi
      - name: Test (if script exists)
        shell: bash
        run: |
          if grep -q '"test"' package.json; then bun run test; else echo "no test script — skipping"; fi
      - name: Build
        run: bun run build
      - name: Artifact-load smoke (dist/hostPlugin.js imports without throwing)
        # `bun run build` only checks that the bundler can produce output —
        # it does NOT verify the bundle actually loads at runtime. esbuild's
        # ESM emit silently inserts a runtime-throwing fallback shim for
        # dynamic `require()` calls inside bundled CJS deps (node-ical,
        # chokidar, msal-node, etc.); the build "succeeds" but `import()`
        # of the artifact throws "Dynamic require of \"fs\" is not supported"
        # the first time a dep tries to require something at module load.
        #
        # This step does the smallest possible runtime check: dynamic-import
        # the produced `dist/hostPlugin.js` from a bare Node process.
        # Throwing here catches every variant of the regression
        # (`Dynamic require of …`, `__filename is not defined`, missing
        # exports, native-binding load failures, …) BEFORE merge.
        #
        # Skipped silently when the entry isn't there — some plugins emit
        # to a different path or via custom build scripts. The presence
        # check keeps this step from breaking those repos when reusable
        # workflow rolls out.
        shell: bash
        run: |
          if [ ! -f dist/hostPlugin.js ]; then
            echo "no dist/hostPlugin.js — skipping artifact smoke"
            exit 0
          fi
          node --input-type=module -e "
            import('./dist/hostPlugin.js').then((m) => {
              const keys = Object.keys(m);
              console.log('artifact-load OK — exports:', keys.length ? keys.join(', ') : '(none)');
            }).catch((e) => {
              console.error('artifact-load FAIL:', e && e.message || e);
              process.exit(1);
            });
          "
