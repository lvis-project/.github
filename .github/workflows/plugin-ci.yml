name: plugin-ci (reusable)
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      bun-version:
        type: string
        default: '1.1.38'
concurrency:
  group: plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: lvis-oracle-ci
      labels: [self-hosted, linux, arm64, oracle]
    # A job that no runner accepts does not error — it waits out the 24-hour
    # queue limit with no red check anywhere. That silence is how a broken
    # publish pipeline went unnoticed for days in 2026-08; the same shape is
    # available to any self-hosted job, so bound it here too. This is generous
    # for work that finishes in well under a minute.
    timeout-minutes: 30
    env:
      BUN_INSTALL: /tmp/lvis-bun-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      # Korean source read back by a CP949 decoder and written out again is
      # destroyed, and nothing else in CI reads Korean. It happened once, in
      # lvis-plugin-ep on 2026-05-26, inside a commit about deleting old pages:
      # 245 lines were mangled and shipped for three months. Two were not
      # comments — a room-alias table whose keys no user input could match, and
      # a remote-work check comparing against a mangled literal.
      #
      # The damage has a fingerprint. A UTF-8 byte pair CP949 can map lands in
      # the CJK ideograph block; one it cannot is written as '?'; and the
      # orphaned third byte of a Hangul syllable passes through as a raw C1
      # control character. None of those belong in a repo that writes Korean,
      # so a line carrying one fails the build that introduces it. U+FFFD is
      # deliberately not one of the signals: this damage never produces it, and
      # the code that guards against a *different* decoder's output legitimately
      # names the character.
      #
      # Deliberate mojibake — a detector for it, a comment documenting it —
      # tags its line `[mojibake-sample]`. That tag is greppable, so the
      # exemptions stay visible instead of piling up in a list here.
      - name: Encoding gate (no CP949 mojibake in source)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/encoding-gate.mjs" <<'JS'
          import { execSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const EXTENSIONS = [".ts", ".tsx", ".js", ".mjs", ".cjs", ".json", ".md"];
          const CJK = /[⺀-⿿㐀-䶿一-鿿豈-﫿]/;
          const LOST = /\?[가-힣]|[가-힣]\?[가-힣]/;
          const EXEMPT = /\[mojibake-sample\]/;
          const hasC1 = (line) =>
            [...line].some((ch) => ch.charCodeAt(0) >= 0x80 && ch.charCodeAt(0) <= 0x9f);

          const tracked = execSync("git ls-files", { encoding: "utf8" }).split("\n");
          const scanned = tracked.filter(
            (file) =>
              (/^(src|skills)\//.test(file) ||
                file === "plugin.json" ||
                file === "package.json") &&
              EXTENSIONS.some((ext) => file.endsWith(ext)),
          );

          const damaged = [];
          for (const file of scanned) {
            readFileSync(file, "utf8")
              .split("\n")
              .forEach((line, index) => {
                if (EXEMPT.test(line)) return;
                if (CJK.test(line) || LOST.test(line) || hasC1(line)) {
                  damaged.push(`${file}:${index + 1}: ${line.trim().slice(0, 120)}`);
                }
              });
          }

          if (damaged.length > 0) {
            for (const hit of damaged) console.log(`::error::${hit}`);
            console.log(
              `\n${damaged.length} line(s) carry the fingerprint of a CP949 round trip.\n` +
                "If the text is meant to look that way, tag its line [mojibake-sample].\n" +
                "Otherwise the file was written by a tool that misread its encoding;\n" +
                "recover the text from git history rather than retyping it.",
            );
            process.exit(1);
          }
          console.log(`encoding gate: ${scanned.length} file(s) clean`);
          JS
          node "$RUNNER_TEMP/encoding-gate.mjs"
      - name: Verify submodule integrity
        shell: bash
        run: |
          if [ -f .gitmodules ]; then
            git submodule status
            while IFS= read -r path; do
              if [ ! -e "$path/.git" ]; then
                echo "::error::Submodule $path not initialized"
                exit 1
              fi
              (cd "$path" && git describe --exact-match --tags HEAD >/dev/null 2>&1) || {
                echo "::warning::Submodule $path is not pinned to a tag"
              }
            done < <(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          fi
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint (if script exists)
        shell: bash
        run: |
          if grep -q '"lint"' package.json; then bun run lint; else echo "no lint script — skipping"; fi
      - name: Typecheck (if script exists)
        shell: bash
        run: |
          if grep -q '"typecheck"' package.json; then bun run typecheck; else echo "no typecheck script — skipping"; fi
      - name: Test (if script exists)
        shell: bash
        run: |
          if grep -q '"test"' package.json; then bun run test; else echo "no test script — skipping"; fi
      - name: Build
        run: bun run build
      - name: Artifact-load smoke (dist/hostPlugin.js imports without throwing)
        # `bun run build` only checks that the bundler can produce output —
        # it does NOT verify the bundle actually loads at runtime. esbuild's
        # ESM emit silently inserts a runtime-throwing fallback shim for
        # dynamic `require()` calls inside bundled CJS deps (node-ical,
        # chokidar, msal-node, etc.); the build "succeeds" but `import()`
        # of the artifact throws "Dynamic require of \"fs\" is not supported"
        # the first time a dep tries to require something at module load.
        #
        # This step does the smallest possible runtime check: dynamic-import
        # the produced `dist/hostPlugin.js` from a bare Node process.
        # Throwing here catches every variant of the regression
        # (`Dynamic require of …`, `__filename is not defined`, missing
        # exports, native-binding load failures, …) BEFORE merge.
        #
        # Skipped silently when the entry isn't there — some plugins emit
        # to a different path or via custom build scripts. The presence
        # check keeps this step from breaking those repos when reusable
        # workflow rolls out.
        shell: bash
        run: |
          if [ ! -f dist/hostPlugin.js ]; then
            echo "no dist/hostPlugin.js — skipping artifact smoke"
            exit 0
          fi
          node --input-type=module -e "
            import('./dist/hostPlugin.js').then((m) => {
              const keys = Object.keys(m);
              console.log('artifact-load OK — exports:', keys.length ? keys.join(', ') : '(none)');
            }).catch((e) => {
              console.error('artifact-load FAIL:', e && e.message || e);
              process.exit(1);
            });
          "
