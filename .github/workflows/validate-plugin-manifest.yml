name: Validate Plugin Manifest
on:
  workflow_call:
    inputs:
      sdk-ref:
        description: >-
          SDK git ref to fetch the manifest schema from. Leave unset: the ref
          is derived from the `#ref` on the caller's own `@lvis/plugin-sdk`
          dependency, so the manifest is checked against the schema the plugin
          actually builds against. Set it only to override that deliberately.
        type: string
        default: ''
      manifest-path:
        description: 'Path to plugin.json relative to repo root'
        type: string
        default: 'plugin.json'

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: lvis-oracle-ci
      labels: [self-hosted, linux, arm64, oracle]
    # A job that no runner accepts does not error — it waits out the 24-hour
    # queue limit with no red check anywhere. That silence is how a broken
    # publish pipeline went unnoticed for days in 2026-08; the same shape is
    # available to any self-hosted job, so bound it here too. This is generous
    # for work that finishes in well under a minute.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The SDK version a plugin builds against is already stated, once, as the
      # `#ref` on its `@lvis/plugin-sdk` dependency. Asking the caller to repeat
      # it as a workflow input stores the same decision twice, and the two
      # drifting is not loud: the manifest simply gets validated against a
      # schema the plugin does not ship with. Every caller but one passed
      # `main` while pinning v8 / v11, so that drift was the normal state.
      # Derive it instead, and keep the input as an explicit override.
      - name: Resolve SDK ref
        id: sdk
        shell: bash
        env:
          SDK_REF_INPUT: ${{ inputs.sdk-ref }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: |
          set -euo pipefail
          ref="$SDK_REF_INPUT"
          origin="sdk-ref input"
          if [ -z "$ref" ]; then
            ref=$(node -e '
              const p = require("./package.json");
              const spec = (p.devDependencies || {})["@lvis/plugin-sdk"]
                || (p.dependencies || {})["@lvis/plugin-sdk"] || "";
              const i = spec.indexOf("#");
              process.stdout.write(i === -1 ? "" : spec.slice(i + 1));
            ') || ref=""
            origin="@lvis/plugin-sdk pin in package.json"
          fi
          if [ -z "$ref" ]; then
            ref=main
            origin="fallback (no sdk-ref input and no pinned SDK dependency)"
            echo "::warning::validating ${MANIFEST_PATH} against the SDK schema on main — this repo pins no SDK version, so the schema it is checked against can move under it"
          fi
          echo "Manifest schema ref: ${ref} (from ${origin})"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - name: Checkout SDK schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: lvis-project/lvis-plugin-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: .sdk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.1.38'
      - name: Validate manifest
        run: |
          bunx -y ajv-cli@5 validate \
            -s .sdk/schemas/plugin-manifest.schema.json \
            -d ${{ inputs.manifest-path }} \
            --spec=draft7 \
            --strict=false
      # Informational drift detector — surfaces when source plugin.json
      # version is at or below the marketplace catalog's latest_stable_version.
      # Doesn't fail the workflow; the publish.yml tag-vs-source check is the
      # actual release-blocker. This step exists to prompt the next merger to
      # bump source so future tag pushes don't fail at release time.
      - name: Check version drift vs marketplace catalog
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: |
          set -u
          SLUG=$(node -e 'process.stdout.write(require("./" + process.env.MANIFEST_PATH).id || "")') || SLUG=""
          SRC_VER=$(node -e 'process.stdout.write(require("./" + process.env.MANIFEST_PATH).version || "")') || SRC_VER=""
          if [ -z "$SLUG" ] || [ -z "$SRC_VER" ]; then
            echo "::warning::could not read plugin.json id/version — skipping drift check"
            exit 0
          fi
          CATALOG=$(curl -sS "https://marketplace.lvisai.xyz/api/v1/catalog" || echo "[]")
          export SLUG
          CAT_VER=$(printf '%s' "$CATALOG" | python3 -c '
          import json, sys, os
          try:
              items = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          slug = os.environ.get("SLUG", "")
          for p in items:
              if p.get("slug") == slug:
                  print(p.get("latest_stable_version", ""))
                  break
          ')
          if [ -z "$CAT_VER" ]; then
            echo "Plugin $SLUG not yet in marketplace — first publish."
            exit 0
          fi
          export SRC_VER CAT_VER
          DRIFT=$(python3 -c '
          import os, re
          rx = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          def parse(v):
              m = rx.match(v)
              return tuple(int(x) for x in m.groups()) if m else None
          s, c = parse(os.environ["SRC_VER"]), parse(os.environ["CAT_VER"])
          print("drift" if (s is not None and c is not None and s <= c) else "ok")
          ')
          if [ "$DRIFT" = "drift" ]; then
            echo "::warning::source plugin.json version $SRC_VER is <= marketplace catalog latest $CAT_VER for $SLUG. Bump source above $CAT_VER before pushing the next release tag — publish.yml's tag-vs-source check will otherwise fail."
          else
            echo "Source $SRC_VER > catalog $CAT_VER for $SLUG — no drift."
          fi

      # Enforce: any in-place plugin.json change on a PR MUST bump version.
      # A manifest whose content changed on main without a version bump never
      # gets republished (the marketplace only republishes a NEW version), so
      # the live catalog keeps serving the old artifact — exactly what broke
      # two intranet plugins' loading after the auth-out-of-tools refactor
      # landed without a bump. The publish gate only fires on tag push; this catches
      # the omission at PR time and forces the bump that triggers a republish.
      - name: Require version bump when plugin.json changes (PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # The default checkout is shallow on the PR merge ref, so the base
          # commit's tree is not present — fetch it to read the prior manifest.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_SHA"
          if ! git cat-file -e "$BASE_SHA:$MANIFEST_PATH" 2>/dev/null; then
            echo "$MANIFEST_PATH is new in this PR — no prior version to compare; skipping."
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" -- "$MANIFEST_PATH"; then
            echo "$MANIFEST_PATH unchanged vs base — version-bump guard not applicable."
            exit 0
          fi
          BASE_VER=$(git show "$BASE_SHA:$MANIFEST_PATH" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).version||""))}catch{process.stdout.write("")}})')
          HEAD_VER=$(node -e 'process.stdout.write(String(require("./"+process.env.MANIFEST_PATH).version||""))')
          echo "$MANIFEST_PATH changed: base version '$BASE_VER' → head version '$HEAD_VER'"
          if [ -z "$HEAD_VER" ]; then
            echo "::error::could not read head $MANIFEST_PATH version"
            exit 1
          fi
          if [ "$BASE_VER" = "$HEAD_VER" ]; then
            echo "::error::$MANIFEST_PATH changed but version was not bumped (still $HEAD_VER). Bump the version — the marketplace only republishes on a new version, and a stale published manifest is what broke two intranet plugins' loading."
            exit 1
          fi
          GREATER=$(BASE_VER="$BASE_VER" HEAD_VER="$HEAD_VER" python3 -c '
          import os, re
          rx = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          def parse(v):
              m = rx.match(v or "")
              return tuple(int(x) for x in m.groups()) if m else None
          b, h = parse(os.environ["BASE_VER"]), parse(os.environ["HEAD_VER"])
          print("yes" if (b is not None and h is not None and h > b) else "no")
          ')
          if [ "$GREATER" != "yes" ]; then
            echo "::error::$MANIFEST_PATH version must strictly increase (base=$BASE_VER head=$HEAD_VER)."
            exit 1
          fi
          echo "✓ version bumped $BASE_VER → $HEAD_VER"

      # Enforce: any dist-affecting SOURCE change on a PR MUST bump version.
      # The plugin.json-only guard above misses the more common case: src/** (or
      # package.json) changes that alter the built dist, merged without touching
      # plugin.json. The marketplace only republishes on a NEW version, so the
      # live catalog keeps serving the stale artifact built from the old source —
      # exactly how local-indexer / meeting / work-assistant ended up with stale
      # published builds under unchanged version labels. dist/ is gitignored and
      # built in CI, so the source files are the dist-affecting signal. We exclude
      # test/doc/CI-only changes (they don't affect the published dist) to avoid
      # false-positive friction.
      - name: Require version bump when dist-affecting source changes (PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # The PR checkout is shallow on the merge ref; fetch the base commit so
          # its tree (and the diff range against HEAD) is available.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null \
            || git fetch --no-tags origin "$BASE_SHA"
          # Classify changed paths between base and the PR head.
          CHANGED=$(git diff --name-only "$BASE_SHA"..HEAD)
          if [ -z "$CHANGED" ]; then
            echo "No file changes detected vs base — source-bump guard not applicable."
            exit 0
          fi
          # A path is dist-affecting when it is under src/** (excluding test files)
          # or is package.json (excluding lockfile-only changes). Everything else
          # (tests, docs, CI, lockfiles) does not change the published dist.
          DIST_AFFECTING=$(CHANGED="$CHANGED" python3 -c '
          import os, re
          paths = [p for p in os.environ["CHANGED"].splitlines() if p]
          test_rx = [
              re.compile(r"(^|/)__tests__/"),
              re.compile(r"\.test\.[^/]+$"),
              re.compile(r"\.spec\.[^/]+$"),
              re.compile(r"(^|/)test/"),
              re.compile(r"(^|/)tests/"),
          ]
          def is_test(p):
              return any(rx.search(p) for rx in test_rx)
          hits = []
          for p in paths:
              if p.startswith("src/") and not is_test(p):
                  hits.append(p)
              elif p == "package.json":
                  hits.append(p)
          # package-lock.json / bun.lockb / yarn.lock are lockfile-only — never
          # dist-affecting on their own (they are filtered out by not matching above).
          print("\n".join(hits))
          ')
          if [ -z "$DIST_AFFECTING" ]; then
            echo "No dist-affecting source changes (only tests/docs/CI/lockfile) — source-bump guard not applicable."
            exit 0
          fi
          echo "Dist-affecting source changed:"
          while IFS= read -r p; do
            [ -n "$p" ] && echo "  - $p"
          done <<< "$DIST_AFFECTING"
          # Read base + head versions. If plugin.json is new in this PR there is no
          # prior version to compare; HEAD must still have a version for publish.
          if git cat-file -e "$BASE_SHA:$MANIFEST_PATH" 2>/dev/null; then
            BASE_VER=$(git show "$BASE_SHA:$MANIFEST_PATH" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).version||""))}catch{process.stdout.write("")}})')
          else
            BASE_VER=""
          fi
          HEAD_VER=$(node -e 'process.stdout.write(String(require("./"+process.env.MANIFEST_PATH).version||""))')
          echo "Source changed: base version '$BASE_VER' → head version '$HEAD_VER'"
          if [ -z "$HEAD_VER" ]; then
            echo "::error::could not read head $MANIFEST_PATH version"
            exit 1
          fi
          if [ -z "$BASE_VER" ]; then
            echo "✓ $MANIFEST_PATH is new in this PR (head version $HEAD_VER) — first publish, source-bump guard satisfied."
            exit 0
          fi
          GREATER=$(BASE_VER="$BASE_VER" HEAD_VER="$HEAD_VER" python3 -c '
          import os, re
          rx = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          def parse(v):
              m = rx.match(v or "")
              return tuple(int(x) for x in m.groups()) if m else None
          b, h = parse(os.environ["BASE_VER"]), parse(os.environ["HEAD_VER"])
          print("yes" if (b is not None and h is not None and h > b) else "no")
          ')
          if [ "$GREATER" != "yes" ]; then
            echo "::error::source changed but version not bumped (base=$BASE_VER head=$HEAD_VER) → the published build would go stale; bump version so the marketplace republishes."
            exit 1
          fi
          echo "✓ source changed and version bumped $BASE_VER → $HEAD_VER"
